<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LeetCode Algorithms - Master 50 Essential Coding Problems with TypeScript Solutions">
  <meta name="theme-color" content="#050505">
  
  <title>LeetCode Algorithms | Neon-Noir</title>
  
  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Cyberpunk Fonts (Directive 58, 59) -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Skip Link for Accessibility -->
  <a href="#app-container" class="u-visually-hidden">Skip to main content</a>

  <!-- Header (Directive 12 - Sticky) -->
  <header id="header" class="l-header" role="banner">
    <div class="c-header">
      <a href="index.html" class="c-logo" aria-label="LeetCode Algorithms Home">
        LEET<span style="color: var(--neon-magenta);">CODE</span>
      </a>
      
      <nav id="main-nav" class="c-nav" aria-label="Main Navigation">
        <ul class="c-nav__list">
          <li class="c-nav__item">
            <a href="index.html" class="c-nav__link">Problems</a>
          </li>
        </ul>
      </nav>

      <button id="theme-toggle" class="c-theme-toggle" aria-label="Toggle Theme" title="Toggle Theme">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content Area (SPA Container) -->
  <div id="app-container" role="main" aria-label="Main Content">
    <!-- Content will be injected by JavaScript -->
  </div>

  <!-- Footer (Directive 13 - Anchored) -->
  <footer id="footer" class="l-footer" role="contentinfo">
    <p class="c-footer-text">
      Built with <span style="color: var(--neon-magenta);">♥</span> using 
      <a href="https://developer.mozilla.org/" class="c-footer-link" target="_blank" rel="noopener noreferrer">Vanilla JS</a>
      • Follows <a href="RAG.md" class="c-footer-link" target="_blank" rel="noopener noreferrer">Neon-Noir Manifesto</a>
    </p>
  </footer>

  <!-- JavaScript (Deferred) -->
  <script src="problems-data.js" defer></script>
  <script src="app.js" defer></script>
  
  <!-- Noscript Fallback -->
  <noscript>
    <style>
      .noscript-message {
        background: var(--bg-surface);
        border: var(--border-neon);
        padding: var(--space-xl);
        margin: var(--space-xl);
        border-radius: var(--border-radius-md);
        text-align: center;
        color: var(--neon-magenta);
      }
    </style>
    <div class="noscript-message">
      <h2>JavaScript Required</h2>
      <p>This application requires JavaScript to display the LeetCode problems.</p>
    </div>
  </noscript>
</body>
</html>
