<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypercubes Visualization</title>
    <link rel="stylesheet" href="style.css">
    <script src="math3d.js"></script>
</head>
<body>
    <header>
        <h1>Hypercubes: 4D and 5D Projections</h1>
    </header>
    <div class="description">
        <p>A hypercube is a n-dimensional analogue of a square (n=2) and a cube (n=3). Here we visualize a 4D Tesseract and a 5D Penteract by projecting their vertices into 3D space, and then into 2D space for the canvas.</p>
    </div>
    <div class="controls">
        <button onclick="setDimension(4)">4D Tesseract</button>
        <button onclick="setDimension(5)">5D Penteract</button>
    </div>
    <canvas id="hyperCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('hyperCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        let dimension = 4;
        let angle = 0;

        function generateVertices(dim) {
            const count = Math.pow(2, dim);
            const vertices = [];
            for (let i = 0; i < count; i++) {
                const v = [];
                for (let j = 0; j < dim; j++) {
                    v.push((i & (1 << j)) ? 1 : -1);
                }
                vertices.push(v);
            }
            return vertices;
        }

        function rotateND(v, angle, axis1, axis2) {
            const res = [...v];
            const x = v[axis1];
            const y = v[axis2];
            res[axis1] = x * Math.cos(angle) - y * Math.sin(angle);
            res[axis2] = x * Math.sin(angle) + y * Math.cos(angle);
            return res;
        }

        function projectND(v) {
            // Project down to 3D
            let curr = [...v];
            while (curr.length > 3) {
                const w = 1 / (3 - curr[curr.length - 1] * 0.5);
                const next = [];
                for (let i = 0; i < curr.length - 1; i++) {
                    next.push(curr[i] * w);
                }
                curr = next;
            }
            return new Vec3(curr[0], curr[1], curr[2]);
        }

        function setDimension(d) {
            dimension = d;
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            const vertices = generateVertices(dimension);
            
            let rotated = vertices.map(v => {
                let rv = rotateND(v, angle, 0, 3); // XY
                rv = rotateND(rv, angle * 0.7, 1, 2); // YZ
                if (dimension > 4) {
                    rv = rotateND(rv, angle * 0.5, 0, 4);
                    rv = rotateND(rv, angle * 0.3, 2, 4);
                }
                return rv;
            });

            const points3D = rotated.map(v => projectND(v));
            const transform = Mat4.rotationX(0.5).multiply(Mat4.rotationY(angle * 0.2));
            const points2D = points3D.map(v => project(transform.transform(v.mul(2)), width, height));

            // Draw edges
            ctx.strokeStyle = 'rgba(33, 150, 243, 0.5)';
            ctx.beginPath();
            for (let i = 0; i < vertices.length; i++) {
                for (let j = i + 1; j < vertices.length; j++) {
                    // Check if they differ by exactly one bit (adjacent in hypercube)
                    let diff = 0;
                    for (let k = 0; k < dimension; k++) {
                        if ((i & (1 << k)) !== (j & (1 << k))) diff++;
                    }
                    if (diff === 1) {
                        ctx.moveTo(points2D[i].x, points2D[i].y);
                        ctx.lineTo(points2D[j].x, points2D[j].y);
                    }
                }
            }
            ctx.stroke();

            // Draw vertices
            ctx.fillStyle = '#4CAF50';
            points2D.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            angle += 0.01;
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
