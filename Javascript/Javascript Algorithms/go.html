<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <title>Neon GO - Ti vs. Računalnik</title>
    <style>
        /* NEON IN BLACK STIL */
        body { 
            background-color: #0a0a0a; /* Globoka črna */
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0;
            color: #00ff41; /* Neon zelena */
        }

        .controls { 
            margin: 20px; 
            text-align: center; 
            text-shadow: 0 0 10px #00ff41;
        }

        #board { 
            display: grid; 
            grid-template-columns: repeat(19, 25px); 
            grid-template-rows: repeat(19, 25px); 
            background-color: #111; 
            padding: 10px; 
            border: 2px solid #00f3ff; /* Neon modra rob */
            box-shadow: 0 0 20px #00f3ff;
        }

        .intersection { 
            width: 25px; height: 25px; 
            display: flex; align-items: center; 
            justify-content: center; position: relative; 
            cursor: pointer; 
        }

        /* Neon mreža */
        .intersection::before { 
            content: ""; position: absolute; width: 100%; height: 1px; 
            background: #333; z-index: 1; 
        }
        .intersection::after { 
            content: ""; position: absolute; width: 1px; height: 100%; 
            background: #333; z-index: 1; 
        }

        /* Neon Kamni */
        .stone { 
            width: 22px; height: 22px; border-radius: 50%; z-index: 2; 
        }

        .black { 
            background: #ff00ff; /* Neon roza namesto črne */
            box-shadow: 0 0 15px #ff00ff, inset 0 0 5px #fff;
        }

        .white { 
            background: #00f3ff; /* Neon modra namesto bele */
            box-shadow: 0 0 15px #00f3ff, inset 0 0 5px #fff;
        }

        button { 
            padding: 10px 20px; 
            cursor: pointer; 
            background: transparent; 
            color: #ff00ff; 
            border: 2px solid #ff00ff; 
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 0 10px #ff00ff;
        }

        button:hover { 
            background: #ff00ff; 
            color: #000; 
            box-shadow: 0 0 25px #ff00ff;
        }

        #status { 
            font-weight: bold; 
            margin-bottom: 15px; 
            font-size: 1.2rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="controls">
    <h1>NEON GO</h1>
    <div id="status">SISTEM PRIPRAVLJEN: Tvoja poteza (ROZA)</div>
    <button onclick="resetGame()">Ponastavi sistem</button>
</div>

<div id="board"></div>

<script>
    // LOGIKA OSTANE ISTA
    const boardSize = 19;
    const boardElement = document.getElementById('board');
    const statusElement = document.getElementById('status');
    let gameState = Array(boardSize).fill().map(() => Array(boardSize).fill(null));
    let isGameOver = false;

    function createBoard() {
        boardElement.innerHTML = '';
        for (let r = 0; r < boardSize; r++) {
            for (let c = 0; c < boardSize; c++) {
                const div = document.createElement('div');
                div.className = 'intersection';
                div.id = `cell-${r}-${c}`;
                div.onclick = () => playerMove(r, c);
                boardElement.appendChild(div);
            }
        }
    }

    function playerMove(r, c) {
        if (gameState[r][c] || isGameOver) return;

        placeStone(r, c, 'black');
        
        if (!isGameOver) {
            statusElement.textContent = "RAČUNALNIK PROCESIRA...";
            setTimeout(computerMove, 400);
        }
    }

    function computerMove() {
        if (isGameOver) return;

        let moveFound = false;
        let r, c;
        let attempts = 0;
        while (!moveFound && attempts < 1000) {
            r = Math.floor(Math.random() * boardSize);
            c = Math.floor(Math.random() * boardSize);
            if (!gameState[r][c]) {
                moveFound = true;
            }
            attempts++;
        }

        if (moveFound) {
            placeStone(r, c, 'white');
            statusElement.textContent = "TVOJA POTEZA (ROZA)";
        } else {
            statusElement.textContent = "KONEC: POMNILNIK POLN!";
            isGameOver = true;
        }
    }

    function placeStone(r, c, color) {
        gameState[r][c] = color;
        const cell = document.getElementById(`cell-${r}-${c}`);
        const stone = document.createElement('div');
        stone.className = `stone ${color}`;
        cell.appendChild(stone);
    }

    function resetGame() {
        gameState = Array(boardSize).fill().map(() => Array(boardSize).fill(null));
        isGameOver = false;
        statusElement.textContent = "SISTEM PONASTAVLJEN: Tvoja poteza";
        createBoard();
    }

    createBoard();
</script>

</body>
</html>
