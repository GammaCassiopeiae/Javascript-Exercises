    for (int j = low; j < high; j++) {

    ListNode dummy = new ListNode(0);
    ListNode p = l1, q = l2, curr = dummy;
    int carry = 0;
    while (p != null || q != null) {

        int y = (q != null) ? q.val : 0;
        int sum = carry + x + y;
        carry = sum / 10;

        curr = curr.next;
        if (p != null) p = p.next;
        if (q != null) q = q.next;
    }

    if (nums1.length > nums2.length) return findMedianSortedArrays(nums2, nums1);
    int m = nums1.length, n = nums2.length, left = 0, right = m;
    while (left <= right) {
        int i = left + (right - left) / 2;
        int j = (m + n + 1) / 2 - i;
        if (i < m && nums2[j-1] > nums1[i]) left = i + 1;
        else if (i > 0 && nums1[i-1] > nums2[j]) right = i - 1;

    List<Integer> res = new ArrayList<>();
    if (matrix.length == 0) return res;
    int r1 = 0, r2 = matrix.length - 1, c1 = 0, c2 = matrix[0].length - 1;
    while (r1 <= r2 && c1 <= c2) {
        for (int c = c1; c <= c2; c++) res.add(matrix[r1][c]);
        for (int r = r1 + 1; r <= r2; r++) res.add(matrix[r][c2]);
        if (r1 < r2 && c1 < c2) {
            for (int c = c2 - 1; c > c1; c--) res.add(matrix[r2][c]);
            for (int r = r2; r > r1; r--) res.add(matrix[r][c1]);

private List<List<Integer>> kSum(int[] nums, long target, int start, int k) {

    for (char c : s.toCharArray()) {
        if (c == '(') stack.push(')');
        else if (c == '{') stack.push('}');
        else if (c == '[') stack.push(']');
        else if (stack.isEmpty() || stack.pop() != c) return false;

    if (nums.length < 2) return 0;
    int min = Integer.MAX_VALUE, max = Integer.MIN_VALUE;
    for (int i : nums) { min = Math.min(min, i); max = Math.max(max, i); }
    int gap = Math.max(1, (max - min) / (nums.length - 1));
    int[] minBucket = new int[nums.length], maxBucket = new int[nums.length];
    Arrays.fill(minBucket, Integer.MAX_VALUE); Arrays.fill(maxBucket, Integer.MIN_VALUE);
    for (int i : nums) {
        int idx = (i - min) / gap;
        minBucket[idx] = Math.min(minBucket[idx], i);
        maxBucket[idx] = Math.max(maxBucket[idx], i);
    }
    int maxGap = 0, prev = maxBucket[0];
    for (int i = 1; i < nums.length; i++) {
        if (minBucket[i] == Integer.MAX_VALUE) continue;
        maxGap = Math.max(maxGap, minBucket[i] - prev);
        prev = maxBucket[i];
    }

                    title.classList.add('c-card__title');
                    title.textContent = algo.name;
                    
                    const desc = document.createElement('p');
                    desc.classList.add('u-text-muted');
                    desc.style.marginBottom = '1rem';
                    desc.textContent = algo.description;

                    const pre = document.createElement('pre');
                    pre.classList.add('c-code-block');
                    const code = document.createElement('code');
                    code.textContent = algo.code;
                    
                    pre.appendChild(code);
                    card.appendChild(title);
                    card.appendChild(desc);
                    card.appendChild(pre);
                    fragmentMain.appendChild(card);
                });

                DOM.main.appendChild(fragmentMain);
                DOM.nav.appendChild(fragmentNav);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
