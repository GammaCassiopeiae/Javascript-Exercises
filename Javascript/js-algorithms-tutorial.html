<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JavaScript Algorithms Tutorial - Neon Edition">
    <title>JS Algorithms Mastery | Neon-Noir</title>

    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Backgrounds */
            --bg-dark: #050505;
            --bg-card: rgba(255, 255, 255, 0.03);

            /* Neon Accents */
            --neon-primary: #00f3ff;
            --neon-secondary: #ff00ff;
            --neon-code: limegreen;

            /* Glows */
            --glow-code: 0 0 5px rgba(50, 205, 50, 0.2);
            --glow-primary: 0 0 10px rgba(0, 243, 255, 0.3);

            /* Fonts */
            --font-heading: 'Rajdhani', sans-serif;
            --font-mono: 'Fira Code', monospace;

            /* Layout */
            --sidebar-width: 250px;
            --z-sticky: 100;
        }

        /* Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: #e0e0e0;
            font-family: var(--font-heading);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Layout - Holy Trinity Grid */
        .l-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-areas:
                "header"
                "main"
                "footer";
        }

        @media (min-width: 768px) {
            .l-wrapper {
                grid-template-columns: var(--sidebar-width) 1fr;
                grid-template-areas:
                    "header header"
                    "sidebar main"
                    "footer footer";
            }
        }

        /* Header */
        .c-header {
            grid-area: header;
            padding: 2rem;
            border-bottom: 1px solid rgba(0, 243, 255, 0.1);
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: var(--z-sticky);
            text-align: center;
        }

        .c-header__title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--neon-primary);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            text-shadow: var(--glow-primary);
        }

        /* Sidebar */
        .c-sidebar {
            grid-area: sidebar;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.01);
            border-right: 1px solid rgba(255, 0, 255, 0.05);
            display: none;
        }

        @media (min-width: 768px) {
            .c-sidebar {
                display: block;
                position: sticky;
                top: 0;
                height: 100vh;
                overflow-y: auto;
            }
        }

        .c-nav__list { list-style: none; }
        .c-nav__item { margin-bottom: 1rem; }

        .c-nav__link {
            color: #888;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            display: block;
            padding: 0.5rem;
            border-left: 2px solid transparent;
        }

        .c-nav__link:hover {
            color: var(--neon-secondary);
            border-left: 2px solid var(--neon-secondary);
            padding-left: 1rem;
        }

        /* Main */
        .l-main {
            grid-area: main;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Card - Glassmorphism */
        .c-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 3rem;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }

        .c-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 243, 255, 0.2);
        }

        .c-card__title {
            color: var(--neon-secondary);
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            border-left: 4px solid var(--neon-secondary);
            padding-left: 1rem;
        }

        /* Code Block */
        .c-code-block {
            background: #000;
            padding: 1.5rem;
            border-radius: 4px;
            overflow-x: auto;
            border: 1px solid rgba(50, 205, 50, 0.1);
        }

        .c-code-block code {
            font-family: var(--font-mono);
            color: var(--neon-code);
            text-shadow: var(--glow-code);
            font-size: 0.95rem;
            white-space: pre;
        }

        /* Footer */
        .c-footer {
            grid-area: footer;
            padding: 2rem;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.8rem;
            color: #444;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, var(--neon-primary), var(--neon-secondary));
            border-radius: 4px;
        }
    </style>

    <script>
        (function() {
            'use strict';

            const algorithms = [
                {
                    name: "Bubble Sort",
                    description: "Repeatedly steps through the list, compares adjacent elements and swaps them if they are in the wrong order.",
                    code: `function bubbleSort(arr) {
    const n = arr.length;
    for (let i = 0; i < n - 1; i++) {
        for (let j = 0; j < n - i - 1; j++) {
            if (arr[j] > arr[j + 1]) {
                [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]];
            }
        }
    }
    return arr;
}`
                },
                {
                    name: "Selection Sort",
                    description: "Segments the list into sorted and unsorted parts, repeatedly finding the minimum element from the unsorted part.",
                    code: `function selectionSort(arr) {
    const n = arr.length;
    for (let i = 0; i < n - 1; i++) {
        let minIdx = i;
        for (let j = i + 1; j < n; j++)
            if (arr[j] < arr[minIdx]) minIdx = j;
        [arr[i], arr[minIdx]] = [arr[minIdx], arr[i]];
    }
    return arr;
}`
                },
                {
                    name: "Insertion Sort",
                    description: "Builds the final sorted array one item at a time by picking elements and placing them in their correct position.",
                    code: `function insertionSort(arr) {
    const n = arr.length;
    for (let i = 1; i < n; i++) {
        const key = arr[i];
        let j = i - 1;
        while (j >= 0 && arr[j] > key) {
            arr[j + 1] = arr[j];
            j--;
        }
        arr[j + 1] = key;
    }
    return arr;
}`
                },
                {
                    name: "Merge Sort",
                    description: "Divide and Conquer algorithm that divides the input array into two halves and then merges them.",
                    code: `function merge(arr, l, m, r) {
    const L = arr.slice(l, m + 1);
    const R = arr.slice(m + 1, r + 1);
    let i = 0, j = 0, k = l;
    while (i < L.length && j < R.length) {
        if (L[i] <= R[j]) arr[k++] = L[i++];
        else arr[k++] = R[j++];
    }
    while (i < L.length) arr[k++] = L[i++];
    while (j < R.length) arr[k++] = R[j++];
}

function mergeSort(arr, l = 0, r = arr.length - 1) {
    if (l < r) {
        const m = Math.floor(l + (r - l) / 2);
        mergeSort(arr, l, m);
        mergeSort(arr, m + 1, r);
        merge(arr, l, m, r);
    }
    return arr;
}`
                },
                {
                    name: "Quick Sort",
                    description: "Picks an element as 'pivot' and partitions the given array around the picked pivot.",
                    code: `function partition(arr, low, high) {
    const pivot = arr[high];
    let i = low - 1;
    for (let j = low; j < high; j++) {
        if (arr[j] < pivot) {
            i++;
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }
    [arr[i + 1], arr[high]] = [arr[high], arr[i + 1]];
    return i + 1;
}

function quickSort(arr, low = 0, high = arr.length - 1) {
    if (low < high) {
        const pi = partition(arr, low, high);
        quickSort(arr, low, pi - 1);
        quickSort(arr, pi + 1, high);
    }
    return arr;
}`
                },
                {
                    name: "Heap Sort",
                    description: "Comparison-based sorting technique based on Binary Heap data structure.",
                    code: `function heapify(arr, n, i) {
    let largest = i, l = 2 * i + 1, r = 2 * i + 2;
    if (l < n && arr[l] > arr[largest]) largest = l;
    if (r < n && arr[r] > arr[largest]) largest = r;
    if (largest !== i) {
        [arr[i], arr[largest]] = [arr[largest], arr[i]];
        heapify(arr, n, largest);
    }
}

function heapSort(arr) {
    const n = arr.length;
    for (let i = Math.floor(n / 2) - 1; i >= 0; i--) heapify(arr, n, i);
    for (let i = n - 1; i > 0; i--) {
        [arr[0], arr[i]] = [arr[i], arr[0]];
        heapify(arr, i, 0);
    }
    return arr;
}`
                },
                {
                    name: "Shell Sort",
                    description: "A variation of insertion sort that allows the exchange of items that are far apart.",
                    code: `function shellSort(arr) {
    const n = arr.length;
    for (let gap = Math.floor(n / 2); gap > 0; gap = Math.floor(gap / 2)) {
        for (let i = gap; i < n; i++) {
            const temp = arr[i];
            let j;
            for (j = i; j >= gap && arr[j - gap] > temp; j -= gap)
                arr[j] = arr[j - gap];
            arr[j] = temp;
        }
    }
    return arr;
}`
                },
                {
                    name: "Counting Sort",
                    description: "Non-comparison sorting technique based on keys between a specific range.",
                    code: `function countingSort(arr) {
    const max = Math.max(...arr);
    const count = new Array(max + 1).fill(0);
    const output = new Array(arr.length);
    for (const num of arr) count[num]++;
    for (let i = 1; i <= max; i++) count[i] += count[i - 1];
    for (let i = arr.length - 1; i >= 0; i--) {
        output[count[arr[i]] - 1] = arr[i];
        count[arr[i]]--;
    }
    return output;
}`
                },
                {
                    name: "Radix Sort",
                    description: "Avoids comparison by creating and distributing elements into buckets according to their radix.",
                    code: `function countSortByDigit(arr, exp) {
    const n = arr.length;
    const output = new Array(n).fill(0);
    const count = new Array(10).fill(0);
    for (let i = 0; i < n; i++) count[Math.floor(arr[i] / exp) % 10]++;
    for (let i = 1; i < 10; i++) count[i] += count[i - 1];
    for (let i = n - 1; i >= 0; i--) {
        output[count[Math.floor(arr[i] / exp) % 10] - 1] = arr[i];
        count[Math.floor(arr[i] / exp) % 10]--;
    }
    for (let i = 0; i < n; i++) arr[i] = output[i];
}

function radixSort(arr) {
    const max = Math.max(...arr);
    for (let exp = 1; Math.floor(max / exp) > 0; exp *= 10)
        countSortByDigit(arr, exp);
    return arr;
}`
                },
                {
                    name: "Bucket Sort",
                    description: "Distributes the elements of an array into a number of buckets.",
                    code: `function bucketSort(arr) {
    const n = arr.length;
    if (n <= 0) return arr;
    const buckets = Array.from({ length: n }, () => []);
    for (const num of arr) {
        const idx = Math.floor(num * n);
        buckets[Math.min(idx, n - 1)].push(num);
    }
    for (const bucket of buckets) bucket.sort((a, b) => a - b);
    return [].concat(...buckets);
}`
                },
                {
                    name: "Linear Search",
                    description: "Sequentially checks each element of the list until a match is found or the whole list has been searched.",
                    code: `function linearSearch(arr, target) {
    for (let i = 0; i < arr.length; i++) {
        if (arr[i] === target) return i;
    }
    return -1;
}`
                },
                {
                    name: "Binary Search",
                    description: "Finds the position of a target value within a sorted array by repeatedly dividing the search interval in half.",
                    code: `function binarySearch(arr, target) {
    let left = 0, right = arr.length - 1;
    while (left <= right) {
        const mid = Math.floor(left + (right - left) / 2);
        if (arr[mid] === target) return mid;
        if (arr[mid] < target) left = mid + 1;
        else right = mid - 1;
    }
    return -1;
}`
                },
                {
                    name: "Breadth First Search (BFS)",
                    description: "Traverses a graph level by level, starting from a given source node and exploring all its neighbors first.",
                    code: `function bfs(graph, s) {
    const visited = new Set([s]);
    const queue = [s];
    const result = [];
    while (queue.length) {
        const node = queue.shift();
        result.push(node);
        for (const neighbor of (graph[node] || [])) {
            if (!visited.has(neighbor)) {
                visited.add(neighbor);
                queue.push(neighbor);
            }
        }
    }
    return result;
}`
                },
                {
                    name: "Depth First Search (DFS)",
                    description: "Explores as far as possible along each branch before backtracking using a stack or recursion.",
                    code: `function dfs(graph, v, visited = new Set(), result = []) {
    visited.add(v);
    result.push(v);
    for (const neighbor of (graph[v] || [])) {
        if (!visited.has(neighbor))
            dfs(graph, neighbor, visited, result);
    }
    return result;
}`
                },
                {
                    name: "Two Sum",
                    description: "Finds two numbers in an array that add up to a specific target in linear time.",
                    code: `function twoSum(nums, target) {
    const map = new Map();
    for (let i = 0; i < nums.length; i++) {
        const comp = target - nums[i];
        if (map.has(comp)) return [map.get(comp), i];
        map.set(nums[i], i);
    }
    return null;
}`
                },
                {
                    name: "Sudoku Solver",
                    description: "Solves a Sudoku puzzle by filling empty cells using backtracking.",
                    code: `function solveSudoku(board) { solve(board); }

function solve(board) {
    for (let i = 0; i < 9; i++) {
        for (let j = 0; j < 9; j++) {
            if (board[i][j] === '.') {
                for (let c = 1; c <= 9; c++) {
                    const ch = String(c);
                    if (isValidCell(board, i, j, ch)) {
                        board[i][j] = ch;
                        if (solve(board)) return true;
                        board[i][j] = '.';
                    }
                }
                return false;
            }
        }
    }
    return true;
}

function isValidCell(board, row, col, c) {
    for (let i = 0; i < 9; i++) {
        if (board[row][i] === c) return false;
        if (board[i][col] === c) return false;
        const r = 3 * Math.floor(row / 3) + Math.floor(i / 3);
        const cl = 3 * Math.floor(col / 3) + i % 3;
        if (board[r][cl] === c) return false;
    }
    return true;
}`
                },
                {
                    name: "Add Two Numbers",
                    description: "Adds two numbers represented by linked lists where digits are stored in reverse order.",
                    code: `function addTwoNumbers(l1, l2) {
    let dummy = { val: 0, next: null };
    let curr = dummy;
    let carry = 0;
    while (l1 !== null || l2 !== null) {
        const x = l1 ? l1.val : 0;
        const y = l2 ? l2.val : 0;
        const sum = carry + x + y;
        carry = Math.floor(sum / 10);
        curr.next = { val: sum % 10, next: null };
        curr = curr.next;
        if (l1) l1 = l1.next;
        if (l2) l2 = l2.next;
    }
    if (carry > 0) curr.next = { val: carry, next: null };
    return dummy.next;
}`
                },
                {
                    name: "Median of Two Sorted Arrays",
                    description: "Finds the median of two sorted arrays in logarithmic time complexity.",
                    code: `function findMedianSortedArrays(nums1, nums2) {
    if (nums1.length > nums2.length) return findMedianSortedArrays(nums2, nums1);
    const m = nums1.length, n = nums2.length;
    let left = 0, right = m;
    while (left <= right) {
        const i = Math.floor(left + (right - left) / 2);
        const j = Math.floor((m + n + 1) / 2) - i;
        if (i < m && nums2[j - 1] > nums1[i]) left = i + 1;
        else if (i > 0 && nums1[i - 1] > nums2[j]) right = i - 1;
        else {
            const maxLeft = (i === 0) ? nums2[j-1] : (j === 0) ? nums1[i-1] : Math.max(nums1[i-1], nums2[j-1]);
            if ((m + n) % 2 === 1) return maxLeft;
            const minRight = (i === m) ? nums2[j] : (j === n) ? nums1[i] : Math.min(nums1[i], nums2[j]);
            return (maxLeft + minRight) / 2.0;
        }
    }
    return 0.0;
}`
                },
                {
                    name: "Rotate Array",
                    description: "Rotates an array to the right by k steps using the efficient 3-reverse method.",
                    code: `function rotate(nums, k) {
    k %= nums.length;
    rev(nums, 0, nums.length - 1);
    rev(nums, 0, k - 1);
    rev(nums, k, nums.length - 1);
}
function rev(nums, start, end) {
    while (start < end) {
        [nums[start], nums[end]] = [nums[end], nums[start]];
        start++; end--;
    }
}`
                },
                {
                    name: "Merge Intervals",
                    description: "Merges all overlapping intervals in a collection.",
                    code: `function merge(intervals) {
    intervals.sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const interval of intervals) {
        if (!merged.length || merged[merged.length - 1][1] < interval[0])
            merged.push(interval);
        else
            merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], interval[1]);
    }
    return merged;
}`
                },
                {
                    name: "Rotate Image",
                    description: "Rotates an n x n 2D matrix by 90 degrees (clockwise) in-place.",
                    code: `function rotateImage(matrix) {
    const n = matrix.length;
    for (let i = 0; i < Math.floor(n / 2); i++) {
        for (let j = i; j < n - i - 1; j++) {
            const temp = matrix[i][j];
            matrix[i][j] = matrix[n - 1 - j][i];
            matrix[n - 1 - j][i] = matrix[n - 1 - i][n - 1 - j];
            matrix[n - 1 - i][n - 1 - j] = matrix[j][n - 1 - i];
            matrix[j][n - 1 - i] = temp;
        }
    }
}`
                },
                {
                    name: "Spiral Matrix",
                    description: "Returns all elements of a matrix in spiral order traversal.",
                    code: `function spiralOrder(matrix) {
    const res = [];
    if (!matrix.length) return res;
    let r1 = 0, r2 = matrix.length - 1, c1 = 0, c2 = matrix[0].length - 1;
    while (r1 <= r2 && c1 <= c2) {
        for (let c = c1; c <= c2; c++) res.push(matrix[r1][c]);
        for (let r = r1 + 1; r <= r2; r++) res.push(matrix[r][c2]);
        if (r1 < r2 && c1 < c2) {
            for (let c = c2 - 1; c > c1; c--) res.push(matrix[r2][c]);
            for (let r = r2; r > r1; r--) res.push(matrix[r][c1]);
        }
        r1++; r2--; c1++; c2--;
    }
    return res;
}`
                },
                {
                    name: "Four Sum",
                    description: "Finds all unique quadruplets in the array that sum up to a given target.",
                    code: `function fourSum(nums, target) {
    nums.sort((a, b) => a - b);
    return kSum(nums, target, 0, 4);
}
function kSum(nums, target, start, k) {
    const res = [];
    if (start === nums.length) return res;
    if (k === 2) return twoSumII(nums, target, start);
    for (let i = start; i < nums.length; i++) {
        if (i === start || nums[i - 1] !== nums[i]) {
            for (const subset of kSum(nums, target - nums[i], i + 1, k - 1))
                res.push([nums[i], ...subset]);
        }
    }
    return res;
}
function twoSumII(nums, target, start) {
    const res = [];
    let lo = start, hi = nums.length - 1;
    while (lo < hi) {
        const sum = nums[lo] + nums[hi];
        if (sum < target) lo++;
        else if (sum > target) hi--;
        else {
            res.push([nums[lo++], nums[hi--]]);
            while (lo < hi && nums[lo] === nums[lo - 1]) lo++;
        }
    }
    return res;
}`
                },
                {
                    name: "Valid Parentheses",
                    description: "Determines if the input string has valid matching parentheses using stack tracking.",
                    code: `function isValid(s) {
    const stack = [];
    for (const c of s) {
        if (c === '(') stack.push(')');
        else if (c === '{') stack.push('}');
        else if (c === '[') stack.push(']');
        else if (!stack.length || stack.pop() !== c) return false;
    }
    return stack.length === 0;
}`
                },
                {
                    name: "Longest Substring Without Repeating Characters",
                    description: "Finds the length of the longest substring without repeating characters using a sliding window.",
                    code: `function lengthOfLongestSubstring(s) {
    const map = new Map();
    let ans = 0;
    for (let j = 0, i = 0; j < s.length; j++) {
        if (map.has(s[j])) i = Math.max(map.get(s[j]), i);
        ans = Math.max(ans, j - i + 1);
        map.set(s[j], j + 1);
    }
    return ans;
}`
                },
                {
                    name: "Container With Most Water",
                    description: "Finds two lines that together with the x-axis forms a container that contains the most water.",
                    code: `function maxArea(height) {
    let maxarea = 0, l = 0, r = height.length - 1;
    while (l < r) {
        maxarea = Math.max(maxarea, Math.min(height[l], height[r]) * (r - l));
        if (height[l] < height[r]) l++;
        else r--;
    }
    return maxarea;
}`
                },
                {
                    name: "3Sum",
                    description: "Finds all unique triplets in the array that sum up to zero.",
                    code: `function threeSum(nums) {
    nums.sort((a, b) => a - b);
    const res = [];
    for (let i = 0; i < nums.length - 2 && nums[i] <= 0; i++) {
        if (i === 0 || nums[i - 1] !== nums[i]) {
            let lo = i + 1, hi = nums.length - 1;

                    code: `function criticalConnections(n, connections) {
    const adj = Array.from({ length: n }, () => []);
    for (const [u, v] of connections) { adj[u].push(v); adj[v].push(u); }
    const disc = new Array(n).fill(-1);
    const low  = new Array(n).fill(-1);
    let time = 0;
    const res = [];
    function dfs(u, p) {
        disc[u] = low[u] = ++time;
        for (const v of adj[u]) {
            if (v === p) continue;
            if (disc[v] === -1) {
                dfs(v, u);
                low[u] = Math.min(low[u], low[v]);
                if (low[v] > disc[u]) res.push([u, v]);
            } else low[u] = Math.min(low[u], disc[v]);
        }
    }
    dfs(0, -1);
    return res;
}`
                },
                {
                    name: "Reconstruct Itinerary",
                    description: "Finds the lexicographically smallest itinerary using Hierholzer's algorithm for Eulerian paths.",
                    code: `function findItinerary(tickets) {
    const adj = new Map();
    for (const [from, to] of tickets) {
        if (!adj.has(from)) adj.set(from, []);
        adj.get(from).push(to);
    }
    for (const [, v] of adj) v.sort();
    const res = [];
    function dfs(u) {
        const pq = adj.get(u) || [];
        while (pq.length) dfs(pq.shift());
        res.unshift(u);
    }
    dfs('JFK');
    return res;
}`
                },
                {
                    name: "Dungeon Game",
                    description: "Calculates the minimum initial health needed for a knight to reach the princess using bottom-up DP.",
                    code: `function calculateMinimumHP(dungeon) {
    const m = dungeon.length, n = dungeon[0].length;
    const dp = Array.from({ length: m }, () => new Array(n).fill(0));
    dp[m-1][n-1] = Math.max(1, 1 - dungeon[m-1][n-1]);
    for (let i = m-2; i >= 0; i--) dp[i][n-1] = Math.max(1, dp[i+1][n-1] - dungeon[i][n-1]);
    for (let j = n-2; j >= 0; j--) dp[m-1][j] = Math.max(1, dp[m-1][j+1] - dungeon[m-1][j]);
    for (let i = m-2; i >= 0; i--) {
        for (let j = n-2; j >= 0; j--) {
            const minNext = Math.min(dp[i+1][j], dp[i][j+1]);
            dp[i][j] = Math.max(1, minNext - dungeon[i][j]);
        }
    }
    return dp[0][0];
}`
                },
                {
                    name: "Word Break II",
                    description: "Returns all possible sentences that can be formed by segmenting a string into dictionary words.",
                    code: `function wordBreak(s, wordDict) {
    const memo = new Map();
    function wb(s) {
        if (memo.has(s)) return memo.get(s);
        const res = [];
        if (!s.length) { res.push(''); return res; }
        for (const word of wordDict) {
            if (s.startsWith(word)) {
                const sublist = wb(s.substring(word.length));
                for (const sub of sublist)
                    res.push(word + (sub ? ' ' + sub : ''));
            }
        }
        memo.set(s, res);
        return res;
    }
    return wb(s);
}`
                },
                {
                    name: "House Robber III",
                    description: "Finds the maximum amount of money you can rob from houses in a binary tree structure.",
                    code: `function robTree(root) {
    function robSub(node) {
        if (!node) return [0, 0];
        const left  = robSub(node.left);
        const right = robSub(node.right);
        return [
            Math.max(left[0], left[1]) + Math.max(right[0], right[1]),
            node.val + left[0] + right[0]
        ];
    }
    const res = robSub(root);
    return Math.max(res[0], res[1]);
}`
                },
                {
                    name: "Maximum Gap",
                    description: "Finds the maximum gap between successive elements in a sorted array in linear time using Bucket Sort.",
                    code: `function maximumGap(nums) {
    if (nums.length < 2) return 0;
    const min = Math.min(...nums), max = Math.max(...nums);
    const gap = Math.max(1, Math.floor((max - min) / (nums.length - 1)));
    const minBucket = new Array(nums.length).fill(Infinity);
    const maxBucket = new Array(nums.length).fill(-Infinity);
    for (const num of nums) {
        const idx = Math.floor((num - min) / gap);
        minBucket[idx] = Math.min(minBucket[idx], num);
        maxBucket[idx] = Math.max(maxBucket[idx], num);
    }
    let maxGap = 0, prev = maxBucket[0];
    for (let i = 1; i < nums.length; i++) {
        if (minBucket[i] === Infinity) continue;
        maxGap = Math.max(maxGap, minBucket[i] - prev);
        prev = maxBucket[i];
    }
    return maxGap;
}`
                },
                {
                    name: "Russian Doll Envelopes",
                    description: "Finds the maximum number of envelopes you can Russian doll using O(n log n) LIS.",
                    code: `function maxEnvelopes(envelopes) {
    envelopes.sort((a, b) => a[0] === b[0] ? b[1] - a[1] : a[0] - b[0]);
    const dp = [];
    for (const [, h] of envelopes) {
        let lo = 0, hi = dp.length;
        while (lo < hi) {
            const mid = Math.floor((lo + hi) / 2);
            if (dp[mid] < h) lo = mid + 1;
            else hi = mid;
        }
        dp[lo] = h;
    }
    return dp.length;
}`
                },
                {
                    name: "Minimum Height Trees",
                    description: "Finds all MHTs by repeatedly removing leaves from the graph until only the centroids remain.",
                    code: `function findMinHeightTrees(n, edges) {
    if (n === 1) return [0];
    const adj = Array.from({ length: n }, () => new Set());
    for (const [u, v] of edges) { adj[u].add(v); adj[v].add(u); }
    let leaves = [];
    for (let i = 0; i < n; i++) if (adj[i].size === 1) leaves.push(i);
    let remaining = n;
    while (remaining > 2) {
        remaining -= leaves.length;
        const newLeaves = [];
        for (const leaf of leaves) {
            const neighbor = adj[leaf].values().next().value;
            adj[neighbor].delete(leaf);
            if (adj[neighbor].size === 1) newLeaves.push(neighbor);
        }
        leaves = newLeaves;
    }
    return leaves;
}`
                },
                {
                    name: "Find the Duplicate Number",
                    description: "Finds the duplicate in an array of n+1 integers in O(n) using Floyd's Tortoise and Hare.",
                    code: `function findDuplicate(nums) {
    let tortoise = nums[0], hare = nums[0];
    do {
        tortoise = nums[tortoise];
        hare = nums[nums[hare]];
    } while (tortoise !== hare);
    tortoise = nums[0];
    while (tortoise !== hare) {
        tortoise = nums[tortoise];
        hare = nums[hare];
    }
    return hare;
}`
                }
            ];
